<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Informatique Facile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Informatique Facile</h1>
  <button id="adminBtn"></button>

<script>
const btn = document.getElementById("adminBtn");

function updateAdminButton() {
  const isAdmin = sessionStorage.getItem("admin") === "true";

  if (isAdmin) {
    btn.textContent = "🛠 Admin";
    btn.onclick = () => {
      window.location.href = "admin.html";
    };
  } else {
    btn.textContent = "🔐 Connexion admin";
    btn.onclick = () => {
      window.location.href = "login.html";
    };
  }
}

updateAdminButton();
</script>
  <p>Apprendre l'informatique simplement</p>
</header>

<div class="container">
  <div id="posts"></div>
</div>

<script src="script.js"></script>
<script>
  displayPosts();
</script>

</body>
</html>
